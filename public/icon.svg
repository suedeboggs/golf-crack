<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark green rounded background -->
  <rect width="100" height="100" fill="#1a3a2a" rx="18"/>

  <!-- Flag stick -->
  <line x1="58" y1="18" x2="58" y2="72" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>

  <!-- Flag -->
  <polygon points="58,18 82,30 58,42" fill="#d4af37"/>

  <!-- Golf ball -->
  <circle cx="38" cy="74" r="14" fill="#f0f0f0"/>
  <!-- Dimples -->
  <circle cx="33" cy="69" r="2" fill="#ccc" opacity="0.6"/>
  <circle cx="43" cy="69" r="2" fill="#ccc" opacity="0.6"/>
  <circle cx="38" cy="64" r="2" fill="#ccc" opacity="0.6"/>
  <circle cx="33" cy="78" r="2" fill="#ccc" opacity="0.6"/>
  <circle cx="43" cy="78" r="2" fill="#ccc" opacity="0.6"/>
  <circle cx="38" cy="73" r="1.5" fill="#ccc" opacity="0.6"/>

  <!-- Dollar sign -->
  <text x="70" y="92" font-size="20" font-weight="900" fill="#d4af37" font-family="Georgia,serif" text-anchor="middle">$</text>
</svg>
